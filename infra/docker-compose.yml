services:
  api:
    build:
      context: ../services/api
    ports:
      - "8000:8000"
    environment:
      AI_WORKDOCK_ENV: local
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_workdock
      POSTGRES_USER: workdock
      POSTGRES_PASSWORD: workdock
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:
